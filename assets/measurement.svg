<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Diagram: a resting bid at price p followed across two order-book snapshots, five of the things that can happen between them, and which of them the July rule and the wider rule count as fills.">
  <rect width="1000" height="560" fill="#12161C"/>
  <text x="40" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#F2F4F7" text-anchor="start">How a fill was inferred, and what the wider rule changed</text>
  <text x="40" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#8B98A8" text-anchor="start" font-style="italic">A resting bid at price p, followed across two snapshots of the order book about 2.9 minutes apart.</text>
  <text x="40" y="122" font-family="'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8B98A8" text-anchor="start" letter-spacing="1.5">CASE</text>
  <text x="330" y="122" font-family="'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8B98A8" text-anchor="middle">snapshot 1</text>
  <text x="590" y="122" font-family="'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8B98A8" text-anchor="middle">snapshot 2</text>
  <text x="735" y="122" font-family="'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8B98A8" text-anchor="middle" letter-spacing="1.5">JULY RULE</text>
  <text x="895" y="122" font-family="'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8B98A8" text-anchor="middle" letter-spacing="1.5">WIDER RULE</text>
  <line x1="40" y1="136" x2="960" y2="136" stroke="#232B35"/>
  <text x="46" y="174" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#F2F4F7" text-anchor="start">Filled</text>
  <text x="46" y="198" font-family="'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#8B98A8" text-anchor="start">gone; trades at p, none below</text>
  <line x1="330" y1="156" x2="330" y2="204" stroke="#3A4450"/>
  <line x1="590" y1="156" x2="590" y2="204" stroke="#3A4450"/>
  <line x1="330" y1="174" x2="546" y2="174" stroke="#C9D2DD" stroke-width="3.5" stroke-linecap="round"/>
  <text x="320" y="179" font-family="'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#8B98A8" text-anchor="end">p</text>
  <circle cx="410" cy="174" r="6" fill="#3FB950"/>
  <circle cx="470" cy="174" r="6" fill="#3FB950"/>
  <text x="735" y="186" font-family="'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="17" fill="#3FB950" text-anchor="middle">counted</text>
  <text x="895" y="186" font-family="'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="17" fill="#3FB950" text-anchor="middle">counted</text>
  <text x="46" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#F2F4F7" text-anchor="start">Partly filled</text>
  <text x="46" y="274" font-family="'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#8B98A8" text-anchor="start">smaller; a trade at p</text>
  <line x1="330" y1="232" x2="330" y2="280" stroke="#3A4450"/>
  <line x1="590" y1="232" x2="590" y2="280" stroke="#3A4450"/>
  <line x1="330" y1="250" x2="590" y2="250" stroke="#C9D2DD" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="460" y1="250" x2="590" y2="250" stroke="#12161C" stroke-width="1.8"/>
  <text x="320" y="255" font-family="'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#8B98A8" text-anchor="end">p</text>
  <circle cx="440" cy="250" r="6" fill="#3FB950"/>
  <text x="735" y="262" font-family="'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="17" fill="#3FB950" text-anchor="middle">counted</text>
  <text x="895" y="262" font-family="'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="17" fill="#3FB950" text-anchor="middle">counted</text>
  <rect x="30" y="298" width="940" height="70" rx="4" fill="#1A2029" stroke="#E8A33D" stroke-width="1.6"/>
  <text x="46" y="326" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#F2F4F7" text-anchor="start">Through, with at</text>
  <text x="46" y="350" font-family="'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#8B98A8" text-anchor="start">gone; trades at p and below p</text>
  <line x1="330" y1="308" x2="330" y2="356" stroke="#3A4450"/>
  <line x1="590" y1="308" x2="590" y2="356" stroke="#3A4450"/>
  <line x1="330" y1="326" x2="546" y2="326" stroke="#C9D2DD" stroke-width="3.5" stroke-linecap="round"/>
  <text x="320" y="331" font-family="'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#8B98A8" text-anchor="end">p</text>
  <circle cx="400" cy="326" r="6" fill="#3FB950"/>
  <circle cx="485" cy="326" r="6" fill="#3FB950"/>
  <circle cx="520" cy="348" r="6" fill="#C0392B"/>
  <text x="735" y="338" font-family="'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="17" fill="#8B98A8" text-anchor="middle">left out</text>
  <text x="895" y="338" font-family="'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="17" fill="#4A90D9" text-anchor="middle">counted</text>
  <text x="46" y="402" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#F2F4F7" text-anchor="start">Through</text>
  <text x="46" y="426" font-family="'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#8B98A8" text-anchor="start">gone; trades only below p</text>
  <line x1="330" y1="384" x2="330" y2="432" stroke="#3A4450"/>
  <line x1="590" y1="384" x2="590" y2="432" stroke="#3A4450"/>
  <line x1="330" y1="402" x2="546" y2="402" stroke="#C9D2DD" stroke-width="3.5" stroke-linecap="round"/>
  <text x="320" y="407" font-family="'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#8B98A8" text-anchor="end">p</text>
  <circle cx="440" cy="424" r="6" fill="#C0392B"/>
  <circle cx="505" cy="424" r="6" fill="#C0392B"/>
  <text x="735" y="414" font-family="'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="17" fill="#8B98A8" text-anchor="middle">left out</text>
  <text x="895" y="414" font-family="'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="17" fill="#8B98A8" text-anchor="middle">left out</text>
  <text x="46" y="478" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#F2F4F7" text-anchor="start">Cancelled</text>
  <text x="46" y="502" font-family="'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#8B98A8" text-anchor="start">gone; no trade at p</text>
  <line x1="330" y1="460" x2="330" y2="508" stroke="#3A4450"/>
  <line x1="590" y1="460" x2="590" y2="508" stroke="#3A4450"/>
  <line x1="330" y1="478" x2="546" y2="478" stroke="#C9D2DD" stroke-width="3.5" stroke-linecap="round"/>
  <text x="320" y="483" font-family="'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#8B98A8" text-anchor="end">p</text>
  <text x="735" y="490" font-family="'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="17" fill="#8B98A8" text-anchor="middle">left out</text>
  <text x="895" y="490" font-family="'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="17" fill="#8B98A8" text-anchor="middle">left out</text>
  <circle cx="337" cy="541" r="6" fill="#3FB950"/>
  <text x="350" y="546" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#8B98A8" text-anchor="start">trade printed at p</text>
  <circle cx="517" cy="541" r="6" fill="#C0392B"/>
  <text x="530" y="546" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#8B98A8" text-anchor="start">trade printed below p, through the bid</text>
</svg>

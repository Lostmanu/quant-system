<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Diagram: the data path from exchange feed to estimate, and the six checks that continuous integration runs independently on every push.">
  <rect width="1200" height="700" fill="#12161C"/>

  <text x="60" y="52" font-family="Georgia, serif" font-size="26" fill="#F2F4F7">What had to agree before a number counted</text>
  <text x="60" y="80" font-family="Georgia, serif" font-size="15" font-style="italic" fill="#8B98A8">The path is ordinary. Most of the six checks under it were added after something specific went wrong.</text>

  <!-- ── data path ── -->
  <g font-family="Georgia, serif">
    <rect x="60"  y="112" width="196" height="66" rx="4" fill="#1A2029" stroke="#2A323D"/>
    <text x="158" y="142" font-size="16" fill="#F2F4F7" text-anchor="middle">market data</text>
    <text x="158" y="163" font-size="12" fill="#6B7888" text-anchor="middle" font-family="'SF Mono', Consolas, monospace">own feed + vendor archives</text>

    <rect x="292" y="112" width="196" height="66" rx="4" fill="#1A2029" stroke="#2A323D"/>
    <text x="390" y="142" font-size="16" fill="#F2F4F7" text-anchor="middle">ingestion</text>
    <text x="390" y="163" font-size="12" fill="#6B7888" text-anchor="middle" font-family="'SF Mono', Consolas, monospace">book + trades, replayable</text>

    <rect x="524" y="112" width="196" height="66" rx="4" fill="#1A2029" stroke="#2E7D32" stroke-width="2"/>
    <text x="622" y="142" font-size="16" fill="#F2F4F7" text-anchor="middle">sealed artefact</text>
    <text x="622" y="163" font-size="12" fill="#6B7888" text-anchor="middle" font-family="'SF Mono', Consolas, monospace">npz + manifest</text>

    <rect x="756" y="112" width="196" height="66" rx="4" fill="#1A2029" stroke="#2A323D"/>
    <text x="854" y="142" font-size="16" fill="#F2F4F7" text-anchor="middle">analysis</text>
    <text x="854" y="163" font-size="12" fill="#6B7888" text-anchor="middle" font-family="'SF Mono', Consolas, monospace">markouts by regime</text>

    <rect x="988" y="112" width="152" height="66" rx="4" fill="#1A2029" stroke="#C0392B" stroke-width="2"/>
    <text x="1064" y="142" font-size="16" fill="#F2F4F7" text-anchor="middle">estimate</text>
    <text x="1064" y="163" font-size="12" fill="#C0392B" text-anchor="middle" font-family="'SF Mono', Consolas, monospace">retired 7 Sep 2026</text>
  </g>
  <g stroke="#3A4450" stroke-width="2" fill="none">
    <path d="M256 145 h30" marker-end="url(#a)"/>
    <path d="M488 145 h30" marker-end="url(#a)"/>
    <path d="M720 145 h30" marker-end="url(#a)"/>
    <path d="M952 145 h30" marker-end="url(#a)"/>
  </g>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3A4450"/>
    </marker>
  </defs>

  <line x1="60" y1="218" x2="1140" y2="218" stroke="#2A323D"/>
  <text x="60" y="252" font-family="'SF Mono', Consolas, monospace" font-size="12" fill="#6B7888" letter-spacing="2">SIX CHECKS, EVERY PUSH, EACH ONE REPORTING INDEPENDENTLY OF THE OTHERS</text>

  <!-- ── six gates ── -->
  <g font-family="Georgia, serif">
    <!-- row 1 -->
    <rect x="60" y="272" width="340" height="128" rx="4" fill="#1A2029" stroke="#2E7D32" stroke-width="2"/>
    <text x="82" y="302" font-size="17" fill="#F2F4F7">the test suite</text>
    <text x="82" y="326" font-size="13" fill="#C9D2DD">476 tests, and an autouse fixture that</text>
    <text x="82" y="345" font-size="13" fill="#C9D2DD">fingerprints two protected state folders</text>
    <text x="82" y="364" font-size="13" fill="#C9D2DD">under .git after every single test.</text>
    <text x="82" y="388" font-size="12" font-style="italic" fill="#8B98A8">Built after tests wrote into them three times.</text>

    <rect x="430" y="272" width="340" height="128" rx="4" fill="#1A2029" stroke="#2E7D32" stroke-width="2"/>
    <text x="452" y="302" font-size="17" fill="#F2F4F7">the mutation harness</text>
    <text x="452" y="326" font-size="13" fill="#C9D2DD">49 rows. Each one disables a check in a</text>
    <text x="452" y="345" font-size="13" fill="#C9D2DD">guard and demands that a <tspan font-style="italic">named</tspan> test fail</text>
    <text x="452" y="364" font-size="13" fill="#C9D2DD">with its declared marker. Red is not enough.</text>
    <text x="452" y="388" font-size="12" font-style="italic" fill="#8B98A8">Built after a green test hid a dead guard, twice.</text>

    <rect x="800" y="272" width="340" height="128" rx="4" fill="#1A2029" stroke="#2E7D32" stroke-width="2"/>
    <text x="822" y="302" font-size="17" fill="#F2F4F7">the documental guard</text>
    <text x="822" y="326" font-size="13" fill="#C9D2DD">A preregistration is dated by the commit</text>
    <text x="822" y="345" font-size="13" fill="#C9D2DD">of its governing text, and each rule it</text>
    <text x="822" y="364" font-size="13" fill="#C9D2DD">declares must name a symbol that exists.</text>
    <text x="822" y="388" font-size="12" font-style="italic" fill="#8B98A8">Built after a PREREG written after the fact.</text>

    <!-- row 2 -->
    <rect x="60" y="420" width="340" height="128" rx="4" fill="#1A2029" stroke="#2E7D32" stroke-width="2"/>
    <text x="82" y="450" font-size="17" fill="#F2F4F7">the completeness census</text>
    <text x="82" y="474" font-size="13" fill="#C9D2DD">A dangerous call may appear only where it</text>
    <text x="82" y="493" font-size="13" fill="#C9D2DD">is wrapped — by AST, resolving aliases,</text>
    <text x="82" y="512" font-size="13" fill="#C9D2DD">with exemptions declared per callsite.</text>
    <text x="82" y="536" font-size="12" font-style="italic" fill="#8B98A8">Built after «fixed one of three» happened 4×.</text>

    <rect x="430" y="420" width="340" height="128" rx="4" fill="#1A2029" stroke="#2E7D32" stroke-width="2"/>
    <text x="452" y="450" font-size="17" fill="#F2F4F7">the probe registry</text>
    <text x="452" y="474" font-size="13" fill="#C9D2DD">Every declared rule must resolve to a</text>
    <text x="452" y="493" font-size="13" fill="#C9D2DD">function that imports and is callable.</text>
    <text x="452" y="512" font-size="13" fill="#C9D2DD">It is empty, so today it cannot fail.</text>
    <text x="452" y="536" font-size="12" font-style="italic" fill="#8B98A8">Added when a review noted a name is not a function.</text>

    <rect x="800" y="420" width="340" height="128" rx="4" fill="#1A2029" stroke="#2E7D32" stroke-width="2"/>
    <text x="822" y="450" font-size="17" fill="#F2F4F7">the count is generated</text>
    <text x="822" y="474" font-size="13" fill="#C9D2DD">The register's tally is regenerated from</text>
    <text x="822" y="493" font-size="13" fill="#C9D2DD">its own tables and the build fails if it</text>
    <text x="822" y="512" font-size="13" fill="#C9D2DD">is stale or two entries share an id.</text>
    <text x="822" y="536" font-size="12" font-style="italic" fill="#8B98A8">Put in CI after «34 = 25 + 9» went out with 44 rows.</text>
  </g>

  <line x1="60" y1="592" x2="1140" y2="592" stroke="#2A323D"/>
  <text x="60" y="622" font-family="Georgia, serif" font-size="15" fill="#C9D2DD">None of the six can see an estimate. On 7 September 2026 the one they surrounded fell from <tspan fill="#F2F4F7">+18.24</tspan> basis points to <tspan fill="#F2F4F7">+2.57</tspan>,</text>
  <text x="60" y="646" font-family="Georgia, serif" font-size="15" fill="#C9D2DD">and what retired it was a decision about which trades count, taken by people. The machinery was not asked.</text>
  <text x="60" y="676" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#C0392B">Machinery keeps you honest about the code. It has nothing to say about whether the question was worth asking.</text>
</svg>
